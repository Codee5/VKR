{% extends "base.html" %}
{% set active = "consultations" %}
{% block title %}Добавить консультацию{% endblock %}
{% block content %}
<div class="card" style="max-width:600px">
  <div class="card-header">Новая консультация</div>
  <div class="card-body">
    <form method="post">
      <div class="mb-3"><label class="form-label">Учащийся</label>
        <select name="stud_id" class="form-select">
          {% for s in students %}<option value="{{ s.stud_id }}">{{ s.stud_fullname }}</option>{% endfor %}
        </select></div>
      <div class="mb-3"><label class="form-label">Дата консультации</label>
        <input name="ind_date" type="date" class="form-control" value="2025-04-30"></div>
      <div class="mb-3"><label class="form-label">Психологическая проблема</label>
        <select name="problem" class="form-select">
          {% for p in problems %}<option>{{ p }}</option>{% endfor %}
        </select></div>
      <div class="mb-3"><label class="form-label">Характеристика учащегося</label>
        <textarea name="psyh_char" class="form-control" rows="2" placeholder="Описание поведения, эмоционального состояния..."></textarea></div>
      <div class="mb-3"><label class="form-label">Рекомендации психолога</label>
        <textarea name="recommend" class="form-control" rows="2" placeholder="Рекомендуемые действия..."></textarea></div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary">Сохранить</button>
        <a href="/consultations" class="btn btn-outline-secondary">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
